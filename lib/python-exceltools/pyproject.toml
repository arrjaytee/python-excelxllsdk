
[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "exceltools"
version = "0.dev0"
requires-python = ">=3.11"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "xlwings>=0.33.20",
]

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "exceltools/_addin.c" }]

